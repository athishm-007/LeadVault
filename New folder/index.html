<!doctype html>
<html>
  <head>
    <title>LeadVault</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Amarante&family=Audiowide&family=Black+Ops+One&family=Caveat+Brush&family=Orbitron&family=Playpen+Sans:wght@100..800&family=Rubik+Dirt&display=swap");
    </style>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <h1>LeadVault</h1>
      <h6>Athish</h6>

      <div class="tabs">
        <button id="leads-tab">Leads</button>

        <button id="contacts-tab">Contacts</button>

        <button id="ideas-tab">Startup Ideas</button>

        <button id="notes-tab">Notes</button>
      </div>

      <div class="stats">
        <div class="card">
          <h3 id="lead-count">0</h3>
          <p>Leads</p>
        </div>

        <div class="card">
          <h3 id="contact-count">0</h3>
          <p>Contacts</p>
        </div>

        <div class="card">
          <h3 id="idea-count">0</h3>
          <p>Ideas</p>
        </div>

        <div class="card">
          <h3 id="notes-count">0</h3>
          <p>Notes</p>
        </div>
      </div>

      <button id="export-pdf-btn">Export PDF</button>

      <div id="content-area"></div>
    </div>

    <script src="jspdf.umd.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
